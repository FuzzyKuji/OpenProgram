<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时布局</title>
<meta name="description" content="实时 DAG 布局的交互演示。">
<style>
:root{--bg:#1a1a18;--pan:#232320;--bd:#3a3a36;--tx:#d8d6cc;--tx2:#9a988e;--acc:#d19a66;--cb:#15140f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,'Segoe UI',sans-serif}
.w{max-width:1100px;margin:0 auto;padding:32px 28px 80px}
h1{font-size:23px;border-bottom:2px solid var(--acc);padding-bottom:10px}
.sub{color:var(--tx2);font-size:13.5px;margin:8px 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.bar button{background:var(--pan);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:7px 13px;cursor:pointer;font-size:13.5px}
.bar button.on{background:var(--acc);color:#1a1a19;border-color:var(--acc);font-weight:600}
.bar button:hover:not(.on){border-color:var(--acc)}
.stage{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.stage>div:first-child{flex:1 1 480px;min-width:0;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.canvas{background:#141413;border:1px solid var(--bd);border-radius:10px;min-width:480px;min-height:360px}
.side{flex:1;min-width:260px}
.desc{background:var(--pan);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;font-size:13.5px;color:var(--tx);margin-bottom:14px}
.legend{font-size:12.5px;color:var(--tx2);line-height:1.9}
.legend b{color:var(--tx)}
.tbl{font-size:12px;border-collapse:collapse;margin-top:12px;width:100%}
.tbl td,.tbl th{border:1px solid var(--bd);padding:4px 8px;text-align:left}
.tbl th{background:var(--pan);color:var(--acc)}
code{background:var(--cb);color:var(--acc);padding:1px 5px;border-radius:4px;font:12px Menlo,monospace}
/* 软连接线(通信/合并/attach 回流): 默认隐藏; hover 它的任一端点节点才显示 + 流动动画 */
.soft-link{opacity:0;transition:opacity .15s;pointer-events:none}
.soft-link.active{opacity:.95;animation:flow 0.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
text{font-family:-apple-system,sans-serif;pointer-events:none}
.node{cursor:pointer}
.principles{max-width:1000px;margin:32px auto 0;background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:24px 28px;line-height:1.75;font-size:14px}
.principles h2{font-size:19px;color:var(--acc);border-bottom:2px solid var(--acc);padding-bottom:10px;margin-top:0}
.principles h3{font-size:15.5px;color:#f0eee6;margin:22px 0 6px}
.principles p{margin:6px 0;color:var(--tx)}
.principles ul{margin:6px 0;padding-left:22px}
.principles li{margin:4px 0;color:var(--tx)}
.principles b{color:#f0eee6}
.principles code{background:var(--cb);color:var(--acc);padding:1px 5px;border-radius:4px;font:12px Menlo,monospace}
.stage>div:first-child:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media(max-width:760px){.w{padding:24px 20px 60px}.stage{gap:16px}.stage>div:first-child{flex-basis:480px}.side{min-width:0;width:100%}.principles{padding:20px}.canvas{display:block}}
</style></head>
<body><div class="w">
<h1>实时布局</h1>
<p class="sub">示例节点经过后端 <code>annotate_graph</code> 的移植版（泳道、层级、深度、列偏移）计算。选择场景后，图和表都是算出来的，不是手画的。悬停节点可显示它的跨分支引用线。真实画布随后还会应用<a href="layout.zh.html">前端几何</a>：分叉脊线、线程列和圆形图标节点，这里不模拟。</p>

<div class="bar" id="bar"></div>
<div class="stage">
  <div data-scroll-region tabindex="0" role="region" aria-label="DAG 图横向滚动区域"><svg id="svg" class="canvas"></svg></div>
  <div class="side">
    <div class="desc" id="desc"></div>
    <div class="legend">
      <b>节点</b>：◇ ROOT&nbsp;&nbsp;○ user&nbsp;&nbsp;△ llm&nbsp;&nbsp;□ code&nbsp;&nbsp;◉ merge<br>
      <b>颜色</b> = 分支身份（每条 lane 一色）<br>
      <b>线型</b> = 连线类型：<br>
      &nbsp;━ 同分支&nbsp;&nbsp;- - retry&nbsp;&nbsp;-·- spawn&nbsp;&nbsp;··· 通信(hover)&nbsp;&nbsp;═ 合并&nbsp;&nbsp;┄ attach<br>
      <b>列规则</b>：fork 占两列（竖线列 + 节点列）
    </div>
    <table class="tbl" id="coords"></table>
  </div>
</div>

<script>
document.querySelectorAll('[data-scroll-region]').forEach(region=>region.addEventListener('keydown',event=>{
  const step=Math.max(80,Math.round(region.clientWidth*.75));
  if(event.key==='ArrowRight'){event.preventDefault();region.scrollLeft+=step}
  else if(event.key==='ArrowLeft'){event.preventDefault();region.scrollLeft-=step}
  else if(event.key==='Home'){event.preventDefault();region.scrollLeft=0}
  else if(event.key==='End'){event.preventDefault();region.scrollLeft=region.scrollWidth}
}));



const LANE_COLORS = ["#4f8ef7","#5aad4e","#d4843a","#9d6fe0","#e0445a","#2db3d5","#e0b020","#35b89a"];

function isRoot(m){ return m.display === "root"; }
function predOf(byId, m){ const p=m.predecessor; return (p && byId[p] && p!==m.id) ? p : null; }
function callerOf(byId, m){ const c=m.caller; return (c && byId[c] && c!==m.id) ? c : null; }
function buildMaps(byId, nodes){
  const callerCh={}, predCh={}, fork={};
  for(const m of nodes){
    const c=callerOf(byId,m); if(c){(callerCh[c]=callerCh[c]||[]).push(m.id);}
    const p=predOf(byId,m); if(p){(predCh[p]=predCh[p]||[]).push(m.id);(fork[p]=fork[p]||[]).push(m.id);}
  }
  const bySeq=(a,b)=>(byId[a].created_at||0)-(byId[b].created_at||0);
  for(const k in callerCh)callerCh[k].sort(bySeq);
  for(const k in predCh)predCh[k].sort(bySeq);
  for(const k in fork)fork[k].sort(bySeq);
  return {callerCh,predCh,fork};
}
function computeTier(byId, nodes){
  const tier={};
  function t(id,depth){
    if(id in tier)return tier[id];
    if(depth>200){tier[id]=0;return 0;}
    const m=byId[id];
    if(isRoot(m)){tier[id]=0;return 0;}
    if(m.tierHint!=null){tier[id]=m.tierHint;return m.tierHint;}
    const caller=m.caller||"";
    const pn=caller?byId[caller]:null;
    if(pn && !isRoot(pn)){ const v=t(caller,depth+1)+1; tier[id]=v; return v; }
    const r=m.role||"";
    tier[id] = r==="user"?1 : (r==="assistant"||r==="llm")?2 : (r==="tool"||r==="code")?3 : 1;
    return tier[id];
  }
  for(const m of nodes)t(m.id,0);
  return tier;
}
function computeDepth(byId, nodes, maps){
  const {callerCh,fork}=maps;
  const depth={}; const counter=[0];
  const skip=new Set();
  for(const pid in fork){ const k=fork[pid]; if(k.length>1) k.slice(1).forEach(x=>skip.add(x)); }
  function walkDfs(id){
    if(id in depth)return;
    depth[id]=counter[0]++;
    for(const kid of (callerCh[id]||[])){ if(skip.has(kid))continue; walkDfs(kid); }
  }
  function walkBranch(id,start){
    if(id in depth)return;
    depth[id]=start; let d=start+1;
    for(const kid of (callerCh[id]||[])){
      if(kid in depth)continue;
      depth[kid]=d++;
      for(const gk of (callerCh[kid]||[])) walkBranch(gk, depth[kid]+1);
    }
  }
  const roots=nodes.filter(isRoot).map(m=>m.id).sort((a,b)=>(byId[a].created_at||0)-(byId[b].created_at||0));
  for(const r of roots) walkDfs(r);
  const remaining=nodes.filter(m=>!(m.id in depth)).map(m=>m.id).sort((a,b)=>(byId[a].created_at||0)-(byId[b].created_at||0));
  for(const id of remaining){
    if(id in depth)continue;
    const pid=predOf(byId,byId[id]); let start=0;
    if(pid && pid in depth){
      let aligned=false;
      for(const m of nodes){
        if(m.id===id)continue;
        if(predOf(byId,m)===pid && m.id in depth){ start=depth[m.id]; aligned=true; break; }
      }
      if(!aligned) start=depth[pid]+1;
    }
    walkBranch(id,start);
  }
  return depth;
}
function descendants(byId,nodes,rootId){
  const out=new Set([rootId]); let grew=true;
  while(grew){ grew=false;
    for(const m of nodes){ if(out.has(m.id))continue;
      const c=m.caller, p=m.predecessor;
      if((c&&out.has(c))||(p&&out.has(p))){ out.add(m.id); grew=true; } } }
  return [...out];
}
function computeLane(byId, nodes, maps, tier){
  const {callerCh,predCh,fork}=maps;
  const lane={}; let next=0;
  const isForkCont={};
  for(const pid in fork){ const k=fork[pid]; if(k.length>1) k.forEach((x,i)=>isForkCont[x]=(i===0)); }
  const sameLane=id=> (id in isForkCont)?isForkCont[id]:true;
  function claim(start,my){
    const stack=[start];
    while(stack.length){
      const cur=stack.pop(); if(cur in lane)continue; lane[cur]=my;
      for(const kid of (callerCh[cur]||[])){ if((kid in lane)||!sameLane(kid))continue; if(predOf(byId,byId[kid]))continue; if(byId[kid].spawn_from)continue; stack.push(kid); }
      for(const kid of (predCh[cur]||[])){ if(!(kid in lane)&&sameLane(kid))stack.push(kid); }
    }
  }
  const bySeq=(a,b)=>(byId[a].created_at||0)-(byId[b].created_at||0);
  const roots=nodes.filter(m=>isRoot(m)).map(m=>m.id).sort(bySeq);
  for(const r of roots)if(!(r in lane))claim(r,next++);
  for(const id of nodes.map(m=>m.id).sort(bySeq)){
    if(id in lane)continue;
    const pred=predOf(byId,byId[id]);
    if(pred && (pred in lane) && sameLane(id)) claim(id,lane[pred]);
    else claim(id,next++);
  }
  return lane;
}
function annotate(nodes){
  const byId={}; for(const m of nodes)byId[m.id]=m;
  const maps=buildMaps(byId,nodes);
  const tier=computeTier(byId,nodes);
  const depth=computeDepth(byId,nodes,maps);
  const laneNum=computeLane(byId,nodes,maps,tier);
  const laneNodes={}, laneFirst={};
  for(const m of nodes){ const ln=laneNum[m.id]; (laneNodes[ln]=laneNodes[ln]||[]).push(m.id);
    if(laneFirst[ln]===undefined || depth[m.id]<depth[laneFirst[ln]]) laneFirst[ln]=m.id; }
  const rightmost=ln=>{ const off=offset(ln); let mx=0; for(const n of (laneNodes[ln]||[]))mx=Math.max(mx,tier[n]||0); return off+mx; };
  const laneOff={};
  function offset(ln){
    if(ln in laneOff)return laneOff[ln];
    if(ln===0){laneOff[ln]=0;return 0;}
    const first=laneFirst[ln];
    const forkedFrom=first?predOf(byId,byId[first]):null;
    const baseLane=forkedFrom?laneNum[forkedFrom]:undefined;
    const firstTier=first?(tier[first]||0):0;
    let off;
    if(baseLane!==undefined){
      const baseRight=rightmost(baseLane);
      let placedRight=baseRight;
      for(const pl in laneOff)placedRight=Math.max(placedRight,rightmost(Number(pl)));
      off=Math.max(baseRight,placedRight)+2-firstTier;
    }else{
      let mx=-1; for(const pl in laneOff)mx=Math.max(mx,rightmost(Number(pl))); off=mx+2;
    }
    laneOff[ln]=off; return off;
  }
  const allLanes=[...new Set(Object.values(laneNum))].sort((a,b)=>a-b);
  for(const ln of allLanes)offset(ln);

  for(const m of nodes){ m._lane=laneOff[laneNum[m.id]]||0; m._tier=tier[m.id]||0; m._depth=depth[m.id]||0; m._laneNum=laneNum[m.id]; }
  return nodes;
}


const COL=58, ROW=58, PADX=44, PADY=40, R=11;
function svgEl(tag,attrs){ const e=document.createElementNS("http://www.w3.org/2000/svg",tag); for(const k in attrs)e.setAttribute(k,attrs[k]); return e; }
function laneColor(ln){ return LANE_COLORS[(ln||0)%LANE_COLORS.length]; }

function shapeEl(m,cx,cy,color){
  const r=R, role=m.role||"";
  if(m.display==="root"){ const e=svgEl("rect",{x:cx-r,y:cy-r,width:2*r,height:2*r,rx:3,transform:`rotate(45 ${cx} ${cy})`,fill:"#fff",stroke:color,"stroke-width":2.5}); return [e]; }
  if(role==="user")return [svgEl("circle",{cx,cy,r,fill:"none",stroke:color,"stroke-width":2.5})];
  if(role==="assistant"||role==="llm")return [svgEl("polygon",{points:`${cx},${cy-r} ${cx-r},${cy+r*0.8} ${cx+r},${cy+r*0.8}`,fill:"none",stroke:color,"stroke-width":2.5})];
  if(role==="tool"||role==="code")return [svgEl("rect",{x:cx-r*0.85,y:cy-r*0.85,width:r*1.7,height:r*1.7,rx:2,fill:"none",stroke:color,"stroke-width":2.5})];
  if(role==="merge")return [svgEl("circle",{cx,cy,r,fill:color,stroke:color,"stroke-width":2.5}),svgEl("circle",{cx,cy,r:r*0.45,fill:"#141413"})];
  return [svgEl("circle",{cx,cy,r,fill:"none",stroke:color,"stroke-width":2})];
}
function render(nodes){
  annotate(nodes);
  const byId={}; for(const m of nodes)byId[m.id]=m;
  const depths=[...new Set(nodes.map(m=>m._depth))].sort((a,b)=>a-b);
  const depthRow={}; depths.forEach((d,i)=>depthRow[d]=i);
  const pos=m=>({x:PADX+(m._lane+m._tier)*COL, y:PADY+depthRow[m._depth]*ROW});
  let maxX=0,maxY=0; for(const m of nodes){const p=pos(m);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);}

  const svg=document.getElementById("svg");
  svg.innerHTML=""; svg.setAttribute("width",maxX+PADX+60); svg.setAttribute("height",maxY+PADY);
  const edgeG=svgEl("g",{}), nodeG=svgEl("g",{});
  svg.appendChild(edgeG); svg.appendChild(nodeG);
  for(const m of nodes){
    if(m.display==="root")continue;
    const c=pos(m), color=laneColor(m._laneNum);
    const predId=m.predecessor, callerId=m.caller;
    const parentId=(callerId&&byId[callerId])?callerId:((predId&&byId[predId])?predId:null);
    if(!parentId)continue;
    const parent=byId[parentId], p=pos(parent);
    const isFork=(m._laneNum!==parent._laneNum);
    if(!isFork){
      edgeG.appendChild(svgEl("path",{
        d:`M ${p.x} ${p.y+R} L ${p.x} ${c.y} L ${c.x-R-3} ${c.y}`,
        fill:"none",stroke:color,"stroke-width":1.8}));
    }else{
      const isSpawn=!!m.spawn_from&&byId[m.spawn_from];
      const dash = isSpawn?"4 2 1 2":(m.commLine||m.commFrom?"1 5":(m.independent?"":"5 4"));
      let src=parent;
      if(isSpawn) src=byId[m.spawn_from];
      else if(m.commFrom&&byId[m.commFrom]) src=byId[m.commFrom];
      else if(!m.independent){
        const pred=predOf(byId,m); if(pred){ const sib=(buildMapsCache.fork[pred]||[]).filter(x=>x!==m.id)[0]; if(sib&&byId[sib]) src=byId[sib]; }
      }
      const sp=pos(src);
      edgeG.appendChild(svgEl("path",{d:`M ${sp.x} ${sp.y+R} L ${sp.x} ${c.y} L ${c.x-R-3} ${c.y}`,
        fill:"none",stroke:color,"stroke-width":1.6,"stroke-dasharray":dash,opacity:dash?0.8:1}));
    }
  }
  for(const m of nodes){
    if(m.role!=="merge"||!m.mergeFrom)continue;
    const c=pos(m);
    for(const pid of m.mergeFrom){ const peer=byId[pid]; if(!peer)continue; const pp=pos(peer);
      edgeG.appendChild(svgEl("path",{class:"soft-link","data-from":pid,"data-to":m.id,
        d:`M ${pp.x} ${pp.y+R} L ${pp.x} ${c.y} L ${c.x+R+3} ${c.y}`,fill:"none",stroke:laneColor(peer._laneNum),"stroke-width":2.4})); }
  }
  for(const m of nodes){
    if(!m.attach_from)continue; const dst=pos(m); const src=byId[m.attach_from]; if(!src)continue; const sp=pos(src);
    edgeG.appendChild(svgEl("path",{class:"soft-link","data-from":m.attach_from,"data-to":m.id,
      d:`M ${sp.x} ${sp.y+R} C ${sp.x} ${dst.y+ROW}, ${dst.x} ${dst.y+ROW}, ${dst.x+R} ${dst.y}`,fill:"none",stroke:laneColor(src._laneNum),"stroke-width":1.5,"stroke-dasharray":"4 4"}));
  }
  for(const m of nodes){
    if(!m.commFrom)continue; const src=byId[m.commFrom]; if(!src)continue;
    const sp=pos(src), c=pos(m);
    edgeG.appendChild(svgEl("path",{class:"soft-link","data-from":m.commFrom,"data-to":m.id,
      d:`M ${sp.x+R} ${sp.y} C ${(sp.x+c.x)/2} ${sp.y}, ${(sp.x+c.x)/2} ${c.y}, ${c.x-R} ${c.y}`,
      fill:"none",stroke:laneColor(m._laneNum),"stroke-width":1.8,"stroke-dasharray":"6 4","stroke-linecap":"round"}));
  }
  for(const m of nodes){
    const c=pos(m), color=laneColor(m._laneNum);
    const g=svgEl("g",{class:"node","data-id":m.id});
    for(const e of shapeEl(m,c.x,c.y,color))g.appendChild(e);
    const label=m.label||m.id;
    const t=svgEl("text",{x:c.x+R+7,y:c.y+4,fill:color,"font-size":12}); t.textContent=label; g.appendChild(t);
    if(m.sub){ const s=svgEl("text",{x:c.x+R+7,y:c.y+18,fill:"#6b6a63","font-size":10}); s.textContent=m.sub; g.appendChild(s); }
    nodeG.appendChild(g);
  }
  const softLinks=[...edgeG.querySelectorAll(".soft-link")];
  function showLinksFor(id){
    softLinks.forEach(l=>{
      const on = l.getAttribute("data-from")===id || l.getAttribute("data-to")===id;
      l.classList.toggle("active", on);
    });
  }
  function clearLinks(){ softLinks.forEach(l=>l.classList.remove("active")); }
  nodeG.querySelectorAll(".node").forEach(g=>{
    const id=g.getAttribute("data-id");
    g.style.pointerEvents="all";
    g.addEventListener("mouseenter",()=>showLinksFor(id));
    g.addEventListener("mouseleave",clearLinks);
  });
  const tbl=document.getElementById("coords");
  tbl.innerHTML="<tr><th>id</th><th>lane</th><th>tier</th><th>列</th><th>行</th></tr>"+
    nodes.map(m=>`<tr><td>${m.label||m.id}</td><td>${m._laneNum}</td><td>${m._tier}</td><td>${m._lane+m._tier}</td><td>${depthRow[m._depth]}</td></tr>`).join("");
}
let buildMapsCache={fork:{}};


const R0={id:"ROOT",role:"user",display:"root",created_at:0};
const SCENES=[
 {name:"单轮对话",desc:"发一句话。算法应给全 lane 0，tier 0/1/2 阶梯。",nodes:()=>[R0,
   {id:"u1",role:"user",caller:"ROOT",predecessor:null,created_at:1,label:"你好"},
   {id:"l1",role:"assistant",caller:"u1",predecessor:"u1",created_at:2,label:"AI回复"}]},
 {name:"多轮对话",desc:"两轮。所有 user 都挂 ROOT(tier1)，全 lane 0。",nodes:()=>[R0,
   {id:"u1",role:"user",caller:"ROOT",predecessor:"ROOT",created_at:1,label:"你好"},
   {id:"l1",role:"assistant",caller:"u1",predecessor:"u1",created_at:2,label:"回复1"},
   {id:"u2",role:"user",caller:"ROOT",predecessor:"l1",created_at:3,label:"再问"},
   {id:"l2",role:"assistant",caller:"u2",predecessor:"u2",created_at:4,label:"回复2"}]},
 {name:"retry 分叉",desc:"对第一句 retry → 第2条分支。fork 占两列(竖线+节点)，虚线分叉。",nodes:()=>[R0,
   {id:"u1",role:"user",caller:"ROOT",predecessor:"ROOT",created_at:1,label:"你好"},
   {id:"l1",role:"assistant",caller:"u1",predecessor:"u1",created_at:2,label:"回复1"},
   {id:"u1b",role:"user",caller:"ROOT",predecessor:"ROOT",created_at:3,label:"你好(改写)"},
   {id:"l1b",role:"assistant",caller:"u1b",predecessor:"u1b",created_at:4,label:"回复1'"}]},
 {name:"工具调用",desc:"AI 调工具 → 工具 tier3 缩进，不另开 lane。",nodes:()=>[R0,
   {id:"u1",role:"user",caller:"ROOT",predecessor:null,created_at:1,label:"北京天气"},
   {id:"l1",role:"assistant",caller:"u1",predecessor:"u1",created_at:2,label:"AI回复"},
   {id:"t1",role:"tool",caller:"l1",created_at:3,label:"web_search",sub:"tier3"}]},
 {name:"多 fork(retry 3次)",desc:"同一点 retry 三次 → 三条分支各占独立列，不重叠。",nodes:()=>[R0,
   {id:"u1",role:"user",caller:"ROOT",predecessor:"ROOT",created_at:1,label:"v1"},
   {id:"l1",role:"assistant",caller:"u1",predecessor:"u1",created_at:2,label:"r1"},
   {id:"u2",role:"user",caller:"ROOT",predecessor:"ROOT",created_at:3,label:"v2"},
   {id:"l2",role:"assistant",caller:"u2",predecessor:"u2",created_at:4,label:"r2"},
   {id:"u3",role:"user",caller:"ROOT",predecessor:"ROOT",created_at:5,label:"v3"},
   {id:"l3",role:"assistant",caller:"u3",predecessor:"u3",created_at:6,label:"r3"}]},

function show(i){
  const sc=SCENES[i];
  const nodes=sc.nodes();
  const byId={}; for(const m of nodes)byId[m.id]=m;
  buildMapsCache=buildMaps(byId,nodes);
  document.getElementById("desc").textContent=sc.desc;
  [...document.querySelectorAll("#bar button")].forEach((b,j)=>b.classList.toggle("on",j===i));
  render(nodes);
  try{ history.replaceState(null,"","#"+i); }catch(e){}
}
const bar=document.getElementById("bar");
SCENES.forEach((s,i)=>{ const b=document.createElement("button"); b.textContent=s.name; b.onclick=()=>show(i); bar.appendChild(b); });
function _showFromHash(){
  const h=parseInt((location.hash||"#0").slice(1),10);
  show(Number.isInteger(h)&&h>=0&&h<SCENES.length?h:0);
}
window.addEventListener("hashchange",_showFromHash);
_showFromHash();
