name: Windows install smoke

# Smoke-tests scripts/install.ps1 on a real Windows runner: a complete
# source-development install from a checkout, plus the minimal off-the-web
# bootstrap path (clone + handoff). Given a release tag, it also walks what a
# new Windows user does with that release on x64.
# Runs only when started by hand: pushes, pull requests and schedules start
# nothing, so publishing a version does not set off CI runs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to install (vX.Y.Z); empty checks only the source install
        required: false
        type: string
      older_tag:
        description: Older release to install first, to prove installing over it works
        required: false
        type: string

# Each run started by hand has its own group, so none cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  install-ps1:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-vs2026-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Prepare native ARM64 build dependencies
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: ./scripts/release/prepare-windows-native-deps.ps1 -Architecture arm64
      - name: Complete install from checkout (non-interactive)
        shell: pwsh
        run: .\scripts\install.ps1 -Yes
      - name: openprogram importable after install
        shell: pwsh
        run: |
          $py = ".\.venv\Scripts\python.exe"
          & $py -c "import openprogram; print('openprogram OK:', openprogram.__file__)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "from openprogram.runtime.conversation.turn_runtime import process_user_turn; assert callable(process_user_turn)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path .\apps\web\.next\BUILD_ID)) {
            Write-Error "web production build marker missing"; exit 1
          }
          & $py -m openprogram worker start
          if ($LASTEXITCODE -ne 0) { exit 1 }
          try {
            $doctorOutput = & $py -m openprogram doctor --json
            $doctorExit = $LASTEXITCODE
            $doctorOutput | Write-Output
            $checks = @($doctorOutput | ConvertFrom-Json)
            if ($checks.Count -eq 0 -or $doctorExit -notin @(0, 1)) { exit 1 }
            # A clean install intentionally has no provider credentials. All
            # other diagnostics, including worker health, must still pass.
            $unexpected = @($checks | Where-Object {
              -not $_.ok -and -not (
                $_.id -eq '_check_providers' -and $_.detail -like '0 configured*'
              )
            })
            if ($unexpected.Count -gt 0) { exit 1 }
          } finally {
            & $py -m openprogram worker stop
          }
      - name: Off-the-web bootstrap (clone + handoff, CI env => defaults)
        shell: pwsh
        env:
          OPENPROGRAM_INSTALL_YES: "1"
        run: |
          Copy-Item .\scripts\install.ps1 $env:TEMP\op-install.ps1
          & $env:TEMP\op-install.ps1 -Minimal -Target $env:TEMP\op-bootstrap-clone
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path $env:TEMP\op-bootstrap-clone\pyproject.toml)) {
            Write-Error "bootstrap clone missing"; exit 1
          }

  release-install:
    if: inputs.tag != ''
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      OLDER_TAG: ${{ inputs.older_tag }}
      OPENPROGRAM_REPOSITORY: ${{ github.repository }}
      OPENPROGRAM_WEB_PORT: "19100"
    steps:
      - uses: actions/checkout@v5
      - name: Download the release files
        shell: powershell
        run: |
          $Assets = "$env:RUNNER_TEMP\release-assets"
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $Assets `
            --pattern "OpenProgram-*-runtime-windows-x86_64.zip*" --pattern "OpenProgram-*-win-x64*.exe"
          if ($LASTEXITCODE -ne 0) { throw "could not download the Windows files of $env:TAG" }
          if ($env:OLDER_TAG) {
            gh release download $env:OLDER_TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP\older-assets" `
              --pattern "OpenProgram-*-win-x64*.exe"
            if ($LASTEXITCODE -ne 0) { throw "could not download the Windows files of $env:OLDER_TAG" }
          }
      - name: Windows PowerShell 5.1 under Restricted runs the piped bootstrap
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Restricted -Scope LocalMachine -Force
          Set-ExecutionPolicy -ExecutionPolicy Restricted -Scope CurrentUser -Force
          # The runner sets this for its own scripts; a user's shell does not have it.
          Remove-Item Env:PSExecutionPolicyPreference -ErrorAction SilentlyContinue
          $env:OPENPROGRAM_VERSION = $env:TAG.Substring(1)
          $env:OPENPROGRAM_STATE_DIR = "$env:RUNNER_TEMP\bootstrap-state"
          $env:OPENPROGRAM_BIN_DIR = "$env:RUNNER_TEMP\bootstrap-bin"
          $Command = @'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "expected Windows PowerShell 5.1" }
          if ((Get-ExecutionPolicy) -ne "Restricted") { throw "the policy is not Restricted: $(Get-ExecutionPolicy)" }
          Get-Content -Raw -LiteralPath docs\_static_root\install.ps1 | Invoke-Expression
          '@
          powershell.exe -NoProfile -NonInteractive -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($Command)))
          if ($LASTEXITCODE -ne 0) { throw "the piped bootstrap failed under Restricted" }
          & "$env:OPENPROGRAM_BIN_DIR\openprogram.cmd" --version
          if ($LASTEXITCODE -ne 0) { throw "the bootstrap install does not run" }
      - name: The release ZIP installs and starts a healthy worker
        shell: pwsh
        run: |
          $env:OPENPROGRAM_VERSION = $env:TAG.Substring(1)
          $env:OPENPROGRAM_RUNTIME_ARCHIVE = (
            Get-ChildItem "$env:RUNNER_TEMP\release-assets" -Filter "*.zip" | Select-Object -First 1
          ).FullName
          $env:OPENPROGRAM_STATE_DIR = "$env:RUNNER_TEMP\zip-state"
          $env:OPENPROGRAM_BIN_DIR = "$env:RUNNER_TEMP\zip-bin"
          $env:USERPROFILE = "$env:RUNNER_TEMP\zip-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          scripts/install-release.ps1
          $Command = "$env:OPENPROGRAM_BIN_DIR\openprogram.cmd"
          & $Command --version
          if ($LASTEXITCODE -ne 0) { throw "the ZIP install does not run" }
          & $Command worker start
          if ($LASTEXITCODE -ne 0) { throw "the worker did not start" }
          try {
            $Health = Invoke-RestMethod "http://127.0.0.1:$env:OPENPROGRAM_WEB_PORT/healthz"
            if ($Health.status -ne "ok") { throw "the worker is not healthy" }
          } finally {
            & $Command worker stop
          }
      - name: Silent installer, first launch to a healthy worker, older then newer
        shell: pwsh
        run: |
          function Install-App([string]$Directory) {
            $Installer = Get-ChildItem $Directory -Filter "*.exe" | Select-Object -First 1
            $Process = Start-Process -FilePath $Installer.FullName -ArgumentList "/S" -Wait -PassThru
            if ($Process.ExitCode -ne 0) { throw "$($Installer.Name) exited with code $($Process.ExitCode)" }
            $App = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "OpenProgram.exe" | Select-Object -First 1
            if (-not $App) { throw "the App was not installed" }
            return $App
          }
          function Test-FirstLaunch($App, [string]$Label) {
            $env:USERPROFILE = "$env:RUNNER_TEMP\app-home"
            Remove-Item Env:OPENPROGRAM_WEB_PORT -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
            $Process = Start-Process -FilePath $App.FullName -PassThru
            try {
              $Deadline = (Get-Date).AddMinutes(10)
              do {
                Start-Sleep -Seconds 2
                try { $Health = Invoke-RestMethod "http://127.0.0.1:18100/healthz" -TimeoutSec 5 } catch { $Health = $null }
              } until (($Health -and $Health.status -eq "ok") -or (Get-Date) -gt $Deadline)
              if (-not $Health -or $Health.status -ne "ok") { throw "$Label did not reach a healthy worker" }
              $Chat = Invoke-WebRequest "http://127.0.0.1:18100/chat" -UseBasicParsing
              if ($Chat.StatusCode -ne 200) { throw "$Label did not serve /chat" }
              Write-Output "$Label is healthy: $($App.VersionInfo.ProductVersion)"
            } finally {
              & "$env:USERPROFILE\.openprogram\runtime\bin\openprogram.cmd" worker stop
              Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
              Get-Process OpenProgram -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          if ($env:OLDER_TAG) {
            $Older = Install-App "$env:RUNNER_TEMP\older-assets"
            Test-FirstLaunch $Older "the older App"
          }
          $Newer = Install-App "$env:RUNNER_TEMP\release-assets"
          if ($Newer.VersionInfo.ProductVersion -ne $env:TAG.Substring(1)) {
            throw "installing over the older App left version $($Newer.VersionInfo.ProductVersion)"
          }
          Test-FirstLaunch $Newer "the newer App"
