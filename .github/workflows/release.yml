name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.select.outputs.runtime }}
      seed: ${{ steps.select.outputs.seed }}
      seed_count: ${{ steps.select.outputs.seed_count }}
      desktop: ${{ steps.select.outputs.desktop }}
      desktop_count: ${{ steps.select.outputs.desktop_count }}
      plan: ${{ steps.select.outputs.plan }}
      update_key: ${{ steps.update-key.outputs.trusted }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      # A key the released code does not trust is as good as none: an App built
      # against it could never accept an update.
      - name: Check the update signing key
        id: update-key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.OPENPROGRAM_UPDATE_SIGNING_KEY }}
        run: |
          trusted=false
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            key_file="$RUNNER_TEMP/update-signing-key.pem"
            (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file")
            if public_key="$(uv run --no-project --with zstandard --with cryptography \
                python scripts/release/create-update-assets.py public-key --signing-key "$key_file")" \
              && [ -n "$public_key" ] \
              && grep -qF "$public_key" openprogram/operations/self_update/official/assets.py \
              && grep -qF "$public_key" apps/desktop/main/self-update/update-service.js; then
              trusted=true
            else
              echo "::warning::The update signing key is not listed in RELEASE_PUBLIC_KEYS in both official/assets.py and update-service.js, so Apps that need it are left out."
            fi
            rm -f "$key_file"
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
      - name: Select release platforms
        id: select
        env:
          # Each leg is on unless its variable says false; these three are off
          # unless it says true. Credentials pick signed or unsigned builds.
          OPENPROGRAM_RELEASE_WINDOWS_RUNTIME: ${{ vars.OPENPROGRAM_RELEASE_WINDOWS_RUNTIME }}
          OPENPROGRAM_RELEASE_DESKTOP_MAC: ${{ vars.OPENPROGRAM_RELEASE_DESKTOP_MAC }}
          OPENPROGRAM_RELEASE_DESKTOP_WINDOWS: ${{ vars.OPENPROGRAM_RELEASE_DESKTOP_WINDOWS }}
          OPENPROGRAM_RELEASE_DESKTOP_LINUX: ${{ vars.OPENPROGRAM_RELEASE_DESKTOP_LINUX }}
          OPENPROGRAM_RELEASE_WINDOWS_ARM64: ${{ vars.OPENPROGRAM_RELEASE_WINDOWS_ARM64 }}
          OPENPROGRAM_RELEASE_MAC_THIN: ${{ vars.OPENPROGRAM_RELEASE_MAC_THIN }}
          OPENPROGRAM_RELEASE_CLI_SEEDS: ${{ vars.OPENPROGRAM_RELEASE_CLI_SEEDS }}
          OPENPROGRAM_MAC_SIGNING_AVAILABLE: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && vars.MAC_SIGNING_IDENTITY != '' }}
          OPENPROGRAM_WINDOWS_SIGNING_AVAILABLE: ${{ secrets.WINDOWS_CSC_LINK != '' && secrets.WINDOWS_CSC_KEY_PASSWORD != '' }}
          OPENPROGRAM_UPDATE_KEY_TRUSTED: ${{ steps.update-key.outputs.trusted }}
        run: python3 scripts/release/release-matrix.py select >> "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        run: python scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - name: Build developer Python distributions
        run: |
          scripts/release/stage-release-assets.sh
          rm -rf build
          uv build
      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/_frontend/index.html'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/server.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/routes/files/tree.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/server/ws_actions/webtab.py'
          python -m zipfile -l dist/openprogram-*.whl | grep 'openprogram/interfaces/cli/application.py'
          wheel_path="$(realpath "$(find dist -name 'openprogram-*.whl' -print -quit)")"
          checkout_path="$GITHUB_WORKSPACE"
          probe_dir="$(mktemp -d)"
          (cd "$probe_dir" && OPENPROGRAM_CHECKOUT="$checkout_path" uv run --with "$wheel_path" --no-project -- python -P -c 'from pathlib import Path; import os, openprogram, openprogram.interfaces.cli, openprogram.interfaces.server.server as server; import openprogram.interfaces.server.frontend as frontend; checkout = Path(os.environ["OPENPROGRAM_CHECKOUT"]).resolve(); modules = (openprogram, openprogram.interfaces.cli, server, frontend); assert all(not Path(module.__file__).resolve().is_relative_to(checkout) for module in modules); assert (frontend.out_dir() / "index.html").is_file(); assert openprogram.interfaces.cli.build_parser().prog == "openprogram"')
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- openprogram --version)
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- python -P -m openprogram --version)
          (cd "$probe_dir" && uv run --with "$wheel_path" --no-project -- python -P -m openprogram.interfaces.cli --version)
      - uses: actions/upload-artifact@v7
        with:
          name: developer-python-distributions
          path: dist/*

  product-runtime:
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.runtime) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        if: matrix.platform != 'windows'
        run: python3 scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - name: Verify version on Windows
        if: matrix.platform == 'windows'
        run: python scripts/release/verify-release-version.py --tag "$env:RELEASE_TAG"
      - name: Install Linux runtime test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb xauth libgl1 libglib2.0-0
      - name: Build complete product runtime
        if: matrix.platform != 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a scripts/release/build-product-runtime.sh
          else
            scripts/release/build-product-runtime.sh
          fi
      - name: Prepare native Windows ARM64 OpenSSL
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: scripts/release/prepare-windows-native-deps.ps1 -Architecture arm64
      - name: Build complete Windows product runtime
        if: matrix.platform == 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: pwsh
        run: scripts/release/build-product-runtime.ps1
      - name: Verify Linux runtime on the Ubuntu 22.04 glibc baseline
        if: matrix.platform == 'linux'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
        shell: bash
        run: >-
          bash scripts/release/smoke-linux-runtime-baseline.sh
          "$OPENPROGRAM_RUNTIME_ROOT" "${{ matrix.arch }}"
      - name: Archive complete product runtime
        if: matrix.platform != 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
          OPENPROGRAM_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/runtime-artifacts
          OPENPROGRAM_RUNTIME_PLATFORM: ${{ matrix.platform }}
          OPENPROGRAM_RUNTIME_ARCH: ${{ matrix.arch }}
        run: scripts/release/archive-product-runtime.sh
      - name: Archive complete Windows product runtime
        if: matrix.platform == 'windows'
        env:
          OPENPROGRAM_RUNTIME_ROOT: ${{ runner.temp }}/openprogram-runtime/runtime
          OPENPROGRAM_RUNTIME_OUTPUT_DIR: ${{ runner.temp }}/runtime-artifacts
          OPENPROGRAM_RUNTIME_PLATFORM: ${{ matrix.platform }}
          OPENPROGRAM_RUNTIME_ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: scripts/release/archive-product-runtime.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-artifacts/*
      - name: Build official update assets
        if: needs.platforms.outputs.update_key == 'true'
        shell: bash
        run: |
          uv run --no-project --with zstandard --with cryptography \
            python scripts/release/create-update-assets.py platform \
            --repository . --commit "$(git rev-parse HEAD)" \
            --root "$RUNNER_TEMP/update-store" \
            --platform "${{ matrix.platform }}-${{ matrix.arch }}" \
            --output "$RUNNER_TEMP/update-assets"
      - uses: actions/upload-artifact@v7
        if: needs.platforms.outputs.update_key == 'true'
        with:
          name: update-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/update-assets/*

  seed:
    needs: platforms
    if: ${{ !cancelled() && needs.platforms.result == 'success' && needs.platforms.outputs.seed_count != '0' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.seed) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          # The seed carries a Git bundle of this history.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Verify version
        run: python scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - name: Confirm zstd
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            case "${{ matrix.platform }}" in
              linux) sudo apt-get update && sudo apt-get install --no-install-recommends --yes zstd ;;
              macos) brew install zstd ;;
              windows) choco install zstandard --yes --no-progress ;;
            esac
          fi
          zstd --version
      - name: Check the first install with a small seed
        if: matrix.platform != 'windows'
        run: bash scripts/release/smoke-thin-shell.sh
      - name: Prepare macOS signing keychain
        if: matrix.signing == 'signed'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/release/ci-sign-macos.py setup
      - name: Build the seed
        env:
          OPENPROGRAM_RELEASE_SIGN_IDENTITY: ${{ matrix.signing == 'signed' && vars.MAC_SIGNING_IDENTITY || '' }}
        run: bash scripts/release/build-release-seed.sh "$RUNNER_TEMP/seed-build"
      - name: Remove macOS signing keychain
        if: always() && matrix.signing == 'signed'
        run: python scripts/release/ci-sign-macos.py cleanup
      # A tar keeps the launcher's mode and the helper's links, which an
      # Actions artifact would lose.
      - name: Pack the seed for the App build
        run: |
          mkdir -p "$RUNNER_TEMP/seed-artifact"
          cd "$RUNNER_TEMP/seed-build/seed"
          COPYFILE_DISABLE=1 tar -cf "../seed-${{ matrix.platform }}-${{ matrix.arch }}.tar" .
      - uses: actions/upload-artifact@v7
        with:
          name: seed-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/seed-build/seed-${{ matrix.platform }}-${{ matrix.arch }}.tar
      - name: Pack the command-line seed
        if: matrix.cli_asset == 'true'
        run: |
          name="OpenProgram-${RELEASE_TAG#v}-seed-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          cd "$RUNNER_TEMP/seed-build/cli"
          COPYFILE_DISABLE=1 tar -czf "../$name" seed
          cd ..
          python -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest() + "  " + sys.argv[1])' "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v7
        if: matrix.cli_asset == 'true'
        with:
          name: cli-seed-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/seed-build/OpenProgram-*-seed-*

  desktop:
    needs: [platforms, product-runtime, seed]
    if: ${{ !cancelled() && needs.platforms.result == 'success' && needs.platforms.outputs.desktop_count != '0' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    env:
      THIN_CONFIG: ${{ matrix.layout == 'thin' && '--config build/thin-shell.json' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@v8
        if: matrix.layout == 'full'
        with:
          name: product-runtime-${{ matrix.runtime_platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - uses: actions/download-artifact@v8
        if: matrix.layout == 'thin'
        with:
          name: seed-${{ matrix.runtime_platform }}-${{ matrix.arch }}
          path: seed-artifact
      - name: Verify version
        shell: bash
        run: python scripts/release/verify-release-version.py --tag "${RELEASE_TAG}"
      - name: Install desktop dependencies
        run: npm ci --workspace apps/desktop --include-workspace-root
      - name: Prepare embedded runtime from release archive
        if: matrix.platform == 'mac' && matrix.layout == 'full'
        shell: bash
        run: |
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" scripts/release/prepare-desktop-runtime.sh
      - name: Unpack the seed and write the thin shell configuration
        if: matrix.layout == 'thin'
        shell: bash
        run: |
          mkdir -p apps/desktop/build/seed
          tar -xf seed-artifact/seed-${{ matrix.runtime_platform }}-${{ matrix.arch }}.tar -C apps/desktop/build/seed
          cd apps/desktop
          python ../../scripts/release/thin-shell-config.py build/thin-shell.json build/seed
      - name: Build staged macOS application
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run icon:check
          npx electron-builder --mac --dir --${{ matrix.builder_arch }} --publish never $THIN_CONFIG
      - name: Prepare macOS signing keychain
        if: matrix.platform == 'mac' && matrix.signing == 'signed'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/release/ci-sign-macos.py setup
      - name: Sign and notarize macOS artifacts
        if: matrix.platform == 'mac' && matrix.signing == 'signed'
        env:
          OPENPROGRAM_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
        run: |
          app="$(find apps/desktop/dist -maxdepth 2 -name OpenProgram.app -type d -print -quit)"
          test -n "$app"
          python3 scripts/release/ci-sign-macos.py sign --app "$app" --output apps/desktop/dist --arch ${{ matrix.builder_arch }}
      - name: Remove macOS signing keychain
        if: always() && matrix.platform == 'mac' && matrix.signing == 'signed'
        run: python3 scripts/release/ci-sign-macos.py cleanup
      - name: Ad-hoc sign unsigned macOS artifacts
        if: matrix.platform == 'mac' && matrix.signing == 'unsigned'
        run: |
          app="$(find apps/desktop/dist -maxdepth 2 -name OpenProgram.app -type d -print -quit)"
          test -n "$app"
          python3 scripts/release/ci-sign-macos.py adhoc --app "$app" --output apps/desktop/dist --arch ${{ matrix.builder_arch }}
      - name: Build Windows installer
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_LINK: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.signing == 'signed' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.signing == 'signed' && 'true' || 'false' }}
        run: |
          npx electron-builder --win nsis --${{ matrix.builder_arch }} --publish never --config build/thin-shell.json
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited with code $LASTEXITCODE" }
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          SIGNING: ${{ matrix.signing }}
        run: |
          $Unpacked = Get-ChildItem -LiteralPath apps/desktop/dist -Directory |
            Where-Object { $_.Name -match '^win(?:-arm64)?-unpacked$' } |
            Select-Object -First 1
          if (-not $Unpacked) { throw "unpacked Windows application is missing" }
          $Files = @(
            Get-ChildItem -LiteralPath apps/desktop/dist -Filter "OpenProgram-*.exe" -File
            Get-ChildItem -LiteralPath $Unpacked.FullName -Filter "OpenProgram.exe" -File
          )
          if ($Files.Count -lt 2) { throw "installer or application executable is missing" }
          foreach ($File in $Files) {
            $Signature = Get-AuthenticodeSignature -LiteralPath $File.FullName
            if ($env:SIGNING -eq "signed") {
              if ($Signature.Status -ne "Valid" -or -not $Signature.SignerCertificate) {
                throw "invalid Authenticode signature: $($File.FullName) ($($Signature.Status))"
              }
            } elseif ($Signature.Status -ne "NotSigned") {
              # An unsigned build must be plainly unsigned; a broken signature means it was altered.
              throw "unsigned build has a damaged signature: $($File.FullName) ($($Signature.Status))"
            }
          }
      - name: Name the unsigned Windows installer
        if: matrix.platform == 'win' && matrix.signing == 'unsigned'
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath apps/desktop/dist -Filter "OpenProgram-*.exe" -File |
            Rename-Item -NewName { $_.BaseName + "-unsigned.exe" }
      - name: Check the Windows seed is in the App
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $Unpacked = Get-ChildItem -LiteralPath apps/desktop/dist -Directory |
            Where-Object { $_.Name -match '^win(?:-arm64)?-unpacked$' } |
            Select-Object -First 1
          foreach ($Name in "seed.json", "base.tar.zst", "version.tar.zst", "repo.bundle", "openprogram-launcher.exe") {
            if (-not (Test-Path -LiteralPath (Join-Path $Unpacked.FullName "resources\seed\$Name") -PathType Leaf)) {
              throw "the seed in the Windows App is missing $Name"
            }
          }
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zstd
          # electron-builder's own fpm only runs on x86_64.
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install --no-install-recommends --yes ruby ruby-dev build-essential
            sudo gem install fpm --no-document
            echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
          fi
      - name: Build Linux deb package
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npx electron-builder --linux deb --${{ matrix.builder_arch }} --publish never --config build/thin-shell.json
      # A failed AppImage must not cost the deb: the leg ships what it built and
      # the release notes say the AppImage is missing.
      - name: Build Linux AppImage
        id: appimage
        if: matrix.platform == 'linux'
        continue-on-error: true
        working-directory: apps/desktop
        run: npx electron-builder --linux AppImage --${{ matrix.builder_arch }} --publish never --config build/thin-shell.json
      - name: Discard an incomplete AppImage
        if: matrix.platform == 'linux' && steps.appimage.outcome == 'failure'
        run: rm -f apps/desktop/dist/*.AppImage
      - name: Verify embedded complete runtime
        if: matrix.platform == 'mac'
        run: scripts/release/smoke-packaged-runtime.sh mac apps/desktop/dist
      - name: Verify the Linux App in clean Ubuntu containers
        if: matrix.platform == 'linux'
        run: bash scripts/release/smoke-linux-desktop.sh apps/desktop/dist "${{ matrix.arch }}"
      - name: Create SHA-256 checksums
        if: matrix.platform == 'mac' || matrix.platform == 'linux'
        shell: bash
        run: |
          cd apps/desktop/dist
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Create Windows SHA-256 checksums
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $Lines = Get-ChildItem -LiteralPath apps/desktop/dist -Filter "OpenProgram-*.exe" -File |
            Sort-Object Name |
            ForEach-Object {
              $Algorithm = [Security.Cryptography.SHA256]::Create()
              $Stream = [IO.File]::OpenRead($_.FullName)
              try {
                $Hash = ([BitConverter]::ToString($Algorithm.ComputeHash($Stream))).Replace("-", "").ToLowerInvariant()
              } finally {
                $Stream.Dispose()
                $Algorithm.Dispose()
              }
              "$Hash  $($_.Name)"
            }
          [IO.File]::WriteAllLines(
            "apps/desktop/dist/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}",
            $Lines,
            [Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.layout }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/OpenProgram-*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/SHA256SUMS-*

  cli-installer:
    needs: [platforms, product-runtime]
    if: ${{ !cancelled() && needs.platforms.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.runtime) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: product-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime-artifact
      - name: Install the same complete runtime archive
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          archive="$(find "$GITHUB_WORKSPACE/runtime-artifact" -name '*.tar.gz' -print -quit)"
          OPENPROGRAM_VERSION="$version" \
          OPENPROGRAM_RUNTIME_ARCHIVE="$archive" \
          OPENPROGRAM_STATE_DIR="$RUNNER_TEMP/openprogram-state" \
          OPENPROGRAM_BIN_DIR="$RUNNER_TEMP/openprogram-bin" \
            scripts/install-release.sh
          "$RUNNER_TEMP/openprogram-bin/openprogram" --version
      # Windows PowerShell 5.1, because that is what the public installer hands off to.
      - name: Install the same complete Windows runtime archive
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $env:OPENPROGRAM_VERSION = $env:RELEASE_TAG.Substring(1)
          $env:OPENPROGRAM_RUNTIME_ARCHIVE = (
            Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\runtime-artifact" -Filter "*.zip" |
            Select-Object -First 1
          ).FullName
          $env:OPENPROGRAM_STATE_DIR = "$env:RUNNER_TEMP\openprogram-state"
          $env:OPENPROGRAM_BIN_DIR = "$env:RUNNER_TEMP\openprogram-bin"
          scripts/install-release.ps1
          & "$env:RUNNER_TEMP\openprogram-bin\openprogram.cmd" --version
      # The publish job ships only runtimes that got this far.
      - name: Record the verified install
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-verified"
          date -u > "$RUNNER_TEMP/cli-verified/verified.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-verified-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/cli-verified/verified.txt

  publish:
    needs: [platforms, python, product-runtime, seed, desktop, cli-installer]
    # A failed platform leaves its files out; only this job's own checks refuse.
    if: ${{ !cancelled() && needs.platforms.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.16"
      - name: Check release notes
        run: |
          notes_file=".github/release-notes/$RELEASE_TAG.md"
          release_version="${RELEASE_TAG#v}"
          test -s "$notes_file" || {
            echo "missing release notes: $notes_file" >&2
            exit 1
          }
          python - "$notes_file" "$release_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          notes_path = Path(sys.argv[1])
          version = sys.argv[2]
          notes = notes_path.read_text(encoding="utf-8")
          expected_heading = f"# OpenProgram {version} Release Notes\n"
          if not notes.startswith(expected_heading):
              raise SystemExit(f"invalid release notes heading: {notes_path}")
          if re.search(r"[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]", notes):
              raise SystemExit(f"release notes must be English: {notes_path}")
          PY
      - name: Sign official update assets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.OPENPROGRAM_UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/official-update"
          for directory in release-artifacts/update-assets-*; do
            [ -d "$directory" ] || continue
            mv "$directory"/* "$RUNNER_TEMP/official-update/"
            rmdir "$directory"
          done
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            # The platforms job leaves these out without a key, so getting here
            # with them means something is wrong: they could never update.
            if [ -n "$(find release-artifacts -maxdepth 1 -type d \( -name 'desktop-thin-*' -o -name 'cli-seed-*' \) -print -quit)" ]; then
              echo "this release has thin App or seed assets but no update signing key; add OPENPROGRAM_UPDATE_SIGNING_KEY and run it again" >&2
              exit 1
            fi
            echo "no signing key: this release carries no official update assets" >&2
            exit 0
          fi
          key_file="$RUNNER_TEMP/update-signing-key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file")
          # A failure here costs the Apps that depend on these files, which the
          # next step leaves out and names; it does not cost the release.
          if uv run --no-project --with zstandard --with cryptography \
            python scripts/release/create-update-assets.py finalize \
            --directory "$RUNNER_TEMP/official-update" \
            --release "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --repository . \
            --signing-key "$key_file"; then
            mv "$RUNNER_TEMP/official-update" release-artifacts/official-update
          else
            echo "::warning::The official update files could not be built for this release."
          fi
          rm -f "$key_file"
      - name: Assemble what this release carries
        env:
          RELEASE_PLAN: ${{ needs.platforms.outputs.plan }}
        run: |
          python scripts/release/release-matrix.py assemble release-artifacts \
            --version "$RELEASE_TAG" \
            --plan "$RELEASE_PLAN" \
            --notes ".github/release-notes/$RELEASE_TAG.md" \
            --notes-output "$RUNNER_TEMP/release-notes.md" \
            --links-output "$RUNNER_TEMP/release-links"
      - name: Create release manifest
        run: |
          python scripts/release/create-release-manifest.py release-artifacts \
            --version "$RELEASE_TAG" \
            --output release-artifacts/release-manifest.json
      - name: Publish GitHub Release
        run: |
          final_notes="$RUNNER_TEMP/release-notes.md"
          release_version="${RELEASE_TAG#v}"
          # The version-free copies stay out of release-manifest.json on purpose.
          mapfile -d '' files < <(find release-artifacts "$RUNNER_TEMP/release-links" -type f -print0)
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = true || {
              echo "refusing to overwrite a public release: $RELEASE_TAG" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --title "OpenProgram $release_version Release" --notes-file "$final_notes"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag \
              --title "OpenProgram $release_version Release" \
              --notes-file "$final_notes"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify public latest Release entry
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          for attempt in $(seq 1 12); do
            if curl --disable --proto '=https' --tlsv1.2 -fsS \
              --connect-timeout 5 --max-time 15 --max-filesize 2097152 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'User-Agent: OpenProgram-release-gate' \
              "$api" > latest.json; then
              tag="$(jq -r '.tag_name // empty' latest.json)"
              draft="$(jq -r '.draft' latest.json)"
              prerelease="$(jq -r '.prerelease' latest.json)"
              manifest_count="$(jq '[.assets[] | select(.name == "release-manifest.json")] | length' latest.json)"
              if [ "$tag" = "$RELEASE_TAG" ] && \
                 [ "$draft" = false ] && [ "$prerelease" = false ] && \
                 [ "$manifest_count" = 1 ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "public latest Release did not expose the complete $RELEASE_TAG release" >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
